services:
  - type: web
    name: news-macro-bot
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: TZ_NAME
        value: Asia/Damascus
      - key: LOG_LEVEL
        value: INFO
